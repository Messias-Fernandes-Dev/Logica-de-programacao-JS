<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>do..while</title>
</head>
<body>
  <script>
    alert("digite 0 para sair")
    do{
      const num = Number(prompt("Número: "))
      if(num == 0 || isNaN(num)){
        const sair = confirm("confirma saída?")
        if(sair){
          break
        }else{
          continue
        }
      }
      if (num % 2 == 0){
        alert(`O dobro do ${num} é: ${num * 2}`)
      }else{
        alert(`O triplo do ${num} é: ${num * 3}`)
      }

    }while(true) 
    alert("bye bye..")
  </script>
</body>
</html>
