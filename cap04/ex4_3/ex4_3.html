<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const bairro = prompt("Bairro de Entrga?")
    let taxaEntrga
    switch(bairro){
      case "Centro":
        taxaEntrga = 5.00
        break
      case "Fragata":
      case "Três irmaos":
        taxaEntrga = 7.00
       break
      case "Laranjal":
      taxaEntrga = 10.00
      break
      default: 
      taxaEntrga = 8.00
    }
    alert(`Taxa: ${taxaEntrga.toFixed(2)}`)
  </script>
</body>
</html>
