<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="img/1157109.png" type="image/x-icon">
  <title>ex4_2</title>
</head>
<body>
  <img src="./img/images.jpg" alt="">
  <h1>Cálculo de peso ideal</h1>
  <form action="">
    <p>Nome: 
      <input type="text" id="inNome" required>
    </p>
    <p>Sexo: 
      <input type="radio" name="sexo" id="inMasculino" required> Masculino
      <input type="radio" name="sexo" id="inFeminino" required> Feminino
    </p>
    <p>Altura: 
      <input type="number" min="0" step="0.1" id="inAltura" required>
    </p>
    <input type="submit" value="Cálcular peso ideal">
    <input type="reset" value="Limpar Dados">
  </form>
  <h3></h3>
  <script src="./ex4_2.js"></script>
</body>
</html>
