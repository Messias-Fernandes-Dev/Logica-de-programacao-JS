<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const valorDaConta = Number(prompt("Valor da conta: "))
    const numeroDeClientes = Number(prompt("Número de clientes: "))
    const valorPorClente  = valorDaConta / numeroDeClientes 
    alert(`Valor a ser pago por cada cliente: ${valorPorClente} reais`)
  </script>
</body>
</html>
